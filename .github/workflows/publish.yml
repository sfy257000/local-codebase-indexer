name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,onnx]" onnx build twine
      - run: python -m ruff check local_codebase_indexer scripts && python -m mypy
      - run: python -c "import onnx, onnxruntime, tokenizers" && python -m pytest -q -rs
      - run: python -m build && python -m twine check dist/*
      - name: Validate release versions and generate checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_assets.py --tag "$RELEASE_TAG" --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  pypi:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Remove checksum manifest from the PyPI upload directory
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
  assets:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Upload missing release assets and verify their digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: python scripts/release_assets.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" --dist dist --upload
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the pinned official publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate and publish with GitHub OIDC
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
