[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-codebase-indexer"
dynamic = ["version"]
description = "Trace SQL Server tables to C# callers and Razor pages locally. MCP server and CLI for code search and change impact."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sfy257000" }]
keywords = [
    "mcp", "model-context-protocol", "claude-code", "code-search", "semantic-search", "codebase-index",
    "tree-sitter", "sqlite", "stored-procedure", "csharp", "dapper", "t-sql", "call-graph", "ai-coding-assistant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-c-sharp",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "numpy",
    "pathspec>=0.12.1",
]

[project.optional-dependencies]
onnx = ["onnxruntime", "tokenizers"]
dev = ["pytest", "ruff>=0.9", "mypy>=1.14"]
media = ["Pillow>=10"]

[project.scripts]
local-codebase-indexer = "local_codebase_indexer.cli:main"

[project.urls]
Homepage = "https://github.com/sfy257000/local-codebase-indexer"
Repository = "https://github.com/sfy257000/local-codebase-indexer"
Issues = "https://github.com/sfy257000/local-codebase-indexer/issues"
Documentation = "https://github.com/sfy257000/local-codebase-indexer/blob/main/docs/reference.md"
"Case study" = "https://github.com/sfy257000/local-codebase-indexer/blob/main/docs/case-study.md"

[tool.setuptools.dynamic]
version = { attr = "local_codebase_indexer.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["local_codebase_indexer*"]
namespaces = false

[tool.setuptools.package-data]
local_codebase_indexer = ["demo_project/*.md", "demo_project/**/*.cs", "demo_project/**/*.sql", "demo_project/**/*.cshtml"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["local_codebase_indexer"]
ignore_missing_imports = true
